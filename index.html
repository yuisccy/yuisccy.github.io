<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>理財小勇士：尋寶大冒險</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5c94fc; /* 瑪利歐風格的天空藍 */
            font-family: '微軟正黑體', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            color: #FFD700;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            border: 2px solid white;
            text-shadow: 1px 1px 0 #000;
            display: flex;
            gap: 15px;
        }

        .controls {
            position: absolute;
            bottom: 20px; /* 統一設定底部距離 */
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystick-area {
            left: 20px; /* 調整至左下角，距離左邊 20px */
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: absolute; /* 修正：原本是 relative，改為 absolute 才能正確對齊到底部 */
            border: 2px solid rgba(255,255,255,0.4);
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #jump-btn {
            right: 30px; /* 跳躍鍵維持在右下角 */
            width: 90px;
            height: 90px;
            background: rgba(255, 69, 0, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: bold;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            user-select: none;
        }

        #jump-btn:active {
            background: rgba(255, 69, 0, 1);
            transform: scale(0.95);
        }

        #quiz-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            pointer-events: auto;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            width: 85%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 6px solid #FFD700;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #333;
            font-weight: bold;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.1s;
            font-weight: bold;
            color: #495057;
        }

        .option-btn:active {
            transform: scale(0.98);
            background: #e2e6ea;
        }

        .option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        #start-screen, #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 90;
            pointer-events: auto;
            text-align: center;
        }
        
        #end-screen { display: none; }

        h1 { 
            margin-bottom: 20px; 
            font-size: 3rem; 
            color: #FFD700;
            text-shadow: 4px 4px 0 #b83d00, 6px 6px 0 #000;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 2px;
        }
        
        p { font-size: 1.2rem; max-width: 600px; line-height: 1.6; padding: 0 20px; margin-bottom: 30px;}

        .big-btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            background: linear-gradient(to bottom, #FF4500, #b33000);
            color: white;
            border: 3px solid white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            font-weight: bold;
            transition: transform 0.1s;
        }
        
        .big-btn:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="score-board">
            <div>💰 <span id="score-text">0</span></div>
            <div>📦 <span id="chest-count">0/5</span></div>
        </div>
        
        <div class="controls" id="joystick-area">
            <div id="joystick-knob"></div>
        </div>
        
        <div class="controls" id="jump-btn">JUMP</div>
    </div>

    <div id="quiz-modal">
        <div class="modal-content">
            <h2 style="color: #FF8C00;">🎒 消費小考驗</h2>
            <div class="question-text" id="question-text">題目載入中...</div>
            <div class="options-grid" id="options-container"></div>
            <div id="feedback-msg" style="margin-top:15px; font-weight:bold; min-height: 24px;"></div>
            <!-- 新增：繼續按鈕 (初始隱藏) -->
            <button id="continue-btn" class="big-btn" style="display:none; margin-top: 15px; padding: 10px 30px; font-size: 1.2rem;">繼續冒險</button>
        </div>
    </div>

    <div id="start-screen">
        <h1>理財冒險島</h1>
        <p>控制你的角色，尋找 5 個寶箱！<br>
           ⚠️ 答錯題目寶箱會消失。<br>
           慢慢來，沒有時間限制。<br>
           目標是到達地圖最右邊的城堡旗幟。</p>
        <button class="big-btn" onclick="startGame()">開始冒險</button>
    </div>

    <div id="end-screen">
        <h1 id="end-title">冒險完成！</h1>
        <p id="end-msg">恭喜你到達終點！</p>
        <p>最終得分: <span id="final-score" style="color:#FFD700; font-size: 1.5em;">0</span></p>
        <p>寶箱收集: <span id="final-chests">0</span>/5</p>
        <button class="big-btn" onclick="location.reload()">再玩一次</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let screenWidth = window.innerWidth;
        let screenHeight = window.innerHeight;
        canvas.width = screenWidth;
        canvas.height = screenHeight;

        // 遊戲變數
        let gameState = 'START'; 
        let score = 0;
        let chestsOpened = 0;
        let mapWidth = 3200; // 地圖縮短
        
        // 輸入
        const input = {
            left: false,
            right: false,
            jump: false,
            jumpPressed: false 
        };

        // 題目庫：精選 5 題
        const questionsSource = [
            { q: "你去「理髮店」剪頭髮，理髮師幫你修剪髮型。請問這是？", options: ["購買貨品", "享用服務"], ans: 1, feedback: "沒錯！剪頭髮是理髮師運用技術提供的「服務」。" },
            { q: "你去「文具店」買了一枝鉛筆帶回家。請問這是？", options: ["購買貨品", "享用服務"], ans: 0, feedback: "正確！鉛筆是你可以帶回家的實體「貨品」。" },
            { q: "媽媽在家裡用手機 APP 訂購晚餐送到家，這是什麼購物途徑？", options: ["親身購物", "網上購物"], ans: 1, feedback: "答對了！透過網路和電子設備購買，就是「網上購物」。" },
            { q: "運動鞋穿破了，沒辦法跑步，買一雙新球鞋是？", options: ["想要 (Wants)", "需要 (Needs)"], ans: 1, feedback: "正確！因為舊的壞了影響功能，這是生活必需品。" },
            { q: "看到同學有最新的電動玩具，你也吵著要買。這是？", options: ["需要 (Needs)", "想要 (Wants)"], ans: 1, feedback: "這是「想要」。娛樂很重要，但不是生存必需，要量力而為。" }
        ];

        let gameQuestions = []; 
        let currentChest = null;

        // 洗牌函數
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- 類別 ---

        class Camera {
            constructor() {
                this.x = 0;
            }
            follow(target) {
                let targetX = target.x - screenWidth / 3;
                this.x += (targetX - this.x) * 0.1;
                if(this.x < 0) this.x = 0;
                if(this.x > mapWidth - screenWidth) this.x = mapWidth - screenWidth;
            }
        }

        class Player {
            constructor() {
                this.width = 40;
                this.height = 40; 
                this.x = 100;
                this.y = screenHeight - 150;
                this.vx = 0;
                this.vy = 0;
                this.speed = 6;
                this.jumpPower = -13;
                this.gravity = 0.6;
                this.grounded = false;
                this.face = 'right';
                this.jumpCount = 0;
                this.maxJumps = 2;
                this.jumpCooldown = false;
            }

            update() {
                if (input.left) {
                    this.vx = -this.speed;
                    this.face = 'left';
                } else if (input.right) {
                    this.vx = this.speed;
                    this.face = 'right';
                } else {
                    this.vx *= 0.8;
                }

                if (input.jump) {
                    if (!this.jumpCooldown) {
                        if (this.grounded) {
                            this.vy = this.jumpPower;
                            this.grounded = false;
                            this.jumpCount = 1;
                            this.jumpCooldown = true;
                        } else if (this.jumpCount < this.maxJumps) {
                            this.vy = this.jumpPower * 0.9; 
                            this.jumpCount++;
                            this.jumpCooldown = true;
                            this.vy = this.jumpPower; 
                        }
                    }
                } else {
                    this.jumpCooldown = false; 
                }

                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                this.grounded = false;
                
                if(this.y + this.height > screenHeight - 50) {
                    this.y = screenHeight - 50 - this.height;
                    this.vy = 0;
                    this.grounded = true;
                    this.jumpCount = 0; 
                }

                platforms.forEach(p => {
                    let dir = colCheck(this, p);
                    if (dir === "b") {
                        this.grounded = true;
                        this.jumpCount = 0;
                        this.vy = 0;
                    } else if (dir === "t") {
                        this.vy *= -0.5;
                    }
                });

                if(this.x < 0) this.x = 0;
                if(this.x > mapWidth) this.x = mapWidth;
                
                if(this.y > screenHeight + 200) {
                    this.x -= 200;
                    this.y = 0;
                    this.vy = 0;
                    if(this.x < 50) this.x = 50;
                    score = Math.max(0, score - 50); 
                    updateUI();
                }
            }

            draw(ctx, camX) {
                let x = this.x - camX;
                let y = this.y;
                let w = this.width;
                let h = this.height;

                ctx.save();
                
                if (this.face === 'left') {
                    ctx.translate(x + w, y);
                    ctx.scale(-1, 1);
                    x = 0; 
                    y = 0; 
                } else {
                    ctx.translate(x, y);
                    x = 0;
                    y = 0; 
                }

                const RED = '#e52521';
                const BLUE = '#0000ff'; 
                const SKIN = '#fcc09e';
                const BROWN = '#5c2c04';
                const BUTTON = '#ffff00';

                ctx.fillStyle = RED;
                ctx.fillRect(x, y, w, h * 0.3); 
                ctx.fillRect(x + w*0.2, y - h*0.1, w*0.6, h*0.2); 

                ctx.fillStyle = SKIN;
                ctx.fillRect(x + w*0.1, y + h*0.2, w*0.7, h*0.3);
                
                ctx.fillStyle = SKIN;
                ctx.fillRect(x + w*0.7, y + h*0.3, w*0.2, h*0.1);

                ctx.fillStyle = 'black';
                ctx.fillRect(x + w*0.5, y + h*0.4, w*0.4, h*0.1);

                ctx.fillStyle = 'black';
                ctx.fillRect(x + w*0.5, y + h*0.25, w*0.1, h*0.1);

                ctx.fillStyle = BLUE; 
                ctx.fillRect(x + w*0.1, y + h*0.5, w*0.8, h*0.35);
                
                ctx.fillStyle = RED; 
                ctx.fillRect(x, y + h*0.5, w*0.3, h*0.2); 

                ctx.fillStyle = BUTTON;
                ctx.fillRect(x + w*0.2, y + h*0.6, w*0.1, w*0.1);
                ctx.fillRect(x + w*0.6, y + h*0.6, w*0.1, w*0.1);

                ctx.fillStyle = BROWN;
                ctx.fillRect(x, y + h*0.85, w*0.4, h*0.15); 
                ctx.fillRect(x + w*0.6, y + h*0.85, w*0.4, h*0.15); 

                ctx.restore();
            }
        }

        class Platform {
            constructor(x, y, w, h, type = 'normal') {
                this.x = x;
                this.y = y;
                this.width = w;
                this.height = h;
                this.type = type; 
            }

            draw(ctx, camX) {
                if(this.x - camX > screenWidth || this.x + this.width - camX < 0) return;

                ctx.fillStyle = this.type === 'ground' ? '#6B8CFF' : '#B22222'; 
                
                if (this.type === 'brick') {
                    ctx.fillStyle = '#b64b18';
                    ctx.fillRect(this.x - camX, this.y, this.width, this.height);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(this.x - camX, this.y, this.width, this.height);
                    ctx.fillStyle = '#000';
                    ctx.globalAlpha = 0.2;
                    ctx.fillRect(this.x - camX, this.y + this.height/2, this.width, 2);
                    ctx.globalAlpha = 1.0;
                } else if (this.type === 'mystery') {
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(this.x - camX, this.y, this.width, this.height);
                    ctx.fillStyle = '#000';
                    ctx.font = "bold 20px Arial";
                    ctx.fillText("?", this.x - camX + 13, this.y + 28);
                    ctx.strokeStyle = '#b8860b';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(this.x - camX, this.y, this.width, this.height);
                } else {
                     ctx.fillStyle = '#784616';
                     ctx.fillRect(this.x - camX, this.y, this.width, this.height);
                     ctx.fillStyle = '#5C9A43';
                     ctx.fillRect(this.x - camX, this.y, this.width, 15);
                }
            }
        }

        class Chest {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 44;  
                this.height = 40;
                this.opened = false;
                this.vanished = false; 
            }

            draw(ctx, camX) {
                if(this.vanished || this.x - camX > screenWidth || this.x + this.width - camX < 0) return;

                let drawX = this.x - camX;
                let drawY = this.y;

                if (this.opened) {
                    ctx.font = "40px Arial";
                    ctx.fillText("✨", drawX, drawY + 35);
                    ctx.fillStyle = '#5C3317';
                    ctx.fillRect(drawX, drawY + 15, this.width, 25);
                } else {
                    ctx.save();
                    
                    let grad = ctx.createLinearGradient(drawX, drawY, drawX, drawY + this.height);
                    grad.addColorStop(0, '#A0522D');
                    grad.addColorStop(1, '#8B4513');
                    ctx.fillStyle = grad;
                    
                    ctx.fillRect(drawX, drawY + 12, this.width, 28);
                    
                    ctx.beginPath();
                    ctx.moveTo(drawX, drawY + 12);
                    ctx.bezierCurveTo(drawX, drawY - 5, drawX + this.width, drawY - 5, drawX + this.width, drawY + 12);
                    ctx.fill();

                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(drawX + 5, drawY + 12, 6, 28);
                    ctx.fillRect(drawX + this.width - 11, drawY + 12, 6, 28);
                    
                    ctx.beginPath();
                    ctx.arc(drawX + this.width/2, drawY + 12, 4, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = '#FFFFE0';
                    ctx.beginPath();
                    ctx.arc(drawX + this.width/2, drawY + 14, 5, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(drawX + this.width/2, drawY + 13, 1.5, 0, Math.PI*2);
                    ctx.moveTo(drawX + this.width/2, drawY + 13);
                    ctx.lineTo(drawX + this.width/2 - 1, drawY + 17);
                    ctx.lineTo(drawX + this.width/2 + 1, drawY + 17);
                    ctx.fill();

                    ctx.strokeStyle = '#3e2723';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(drawX, drawY + 12, this.width, 28);
                    ctx.beginPath();
                    ctx.moveTo(drawX, drawY + 12);
                    ctx.bezierCurveTo(drawX, drawY - 5, drawX + this.width, drawY - 5, drawX + this.width, drawY + 12);
                    ctx.stroke();

                    ctx.restore();
                }
            }
        }
        
        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 25;
                this.height = 35;
                this.collected = false;
                this.frame = 0;
            }
            
            update() {
                this.frame += 0.1;
            }
            
            draw(ctx, camX) {
                if(this.collected) return;
                if(this.x - camX > screenWidth || this.x + this.width - camX < 0) return;
                
                let scale = Math.abs(Math.sin(this.frame));
                let cx = this.x - camX + this.width/2;
                
                ctx.fillStyle = "#FFD700";
                ctx.beginPath();
                ctx.ellipse(cx, this.y + this.height/2, this.width/2 * scale, this.height/2, 0, 0, Math.PI*2);
                ctx.fill();
                
                ctx.strokeStyle = "#DAA520";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        
        class Flag {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 300;
            }
            
            draw(ctx, camX) {
                let rx = this.x - camX;
                // 旗桿
                ctx.fillStyle = "#ccc";
                ctx.fillRect(rx + 15, this.y, 10, this.height);
                // 旗頂圓球
                ctx.fillStyle = "gold";
                ctx.beginPath();
                ctx.arc(rx + 20, this.y, 10, 0, Math.PI*2);
                ctx.fill();
                // 旗幟
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.moveTo(rx + 25, this.y + 20);
                ctx.lineTo(rx + 100, this.y + 50);
                ctx.lineTo(rx + 25, this.y + 80);
                ctx.fill();
                
                // 城堡
                ctx.fillStyle = "#a88";
                ctx.fillRect(rx + 80, this.y + 150, 150, 150);
                ctx.fillStyle = "#600"; // 門
                ctx.beginPath();
                ctx.arc(rx + 155, this.y + 300, 40, Math.PI, 0);
                ctx.fill();
            }
        }

        // --- 遊戲物件 ---
        const player = new Player();
        const camera = new Camera();
        let platforms = [];
        let chests = [];
        let coins = [];
        let finishFlag;

        function initLevel() {
            platforms = [];
            chests = [];
            coins = [];
            
            // 地板
            platforms.push(new Platform(-100, screenHeight - 50, mapWidth + 200, 100, 'ground'));
            
            // 金幣大幅減少，只作為路徑引導
            
            // 寶箱 1: 簡單平台
            platforms.push(new Platform(350, screenHeight - 200, 150, 40, 'brick'));
            chests.push(new Chest(400, screenHeight - 240));
            coins.push(new Coin(300, screenHeight - 250)); // 引導金幣

            // 寶箱 2: 跳躍區
            platforms.push(new Platform(800, screenHeight - 300, 200, 40, 'brick'));
            chests.push(new Chest(900, screenHeight - 340));
            coins.push(new Coin(750, screenHeight - 200)); // 引導跳躍
            
            // 寶箱 3: 水管後
            platforms.push(new Platform(1300, screenHeight - 150, 60, 100, 'pipe')); 
            chests.push(new Chest(1450, screenHeight - 90)); // 地面
            coins.push(new Coin(1330, screenHeight - 170)); // 水管上

            // 寶箱 4: 高處平台
            platforms.push(new Platform(1800, screenHeight - 250, 100, 40, 'brick'));
            platforms.push(new Platform(2000, screenHeight - 350, 100, 40, 'mystery'));
            chests.push(new Chest(2030, screenHeight - 390));
            coins.push(new Coin(1950, screenHeight - 300));
            
            // 寶箱 5: 終點前
            platforms.push(new Platform(2400, screenHeight - 200, 150, 40, 'brick'));
            chests.push(new Chest(2450, screenHeight - 240));
            
            // 最後衝刺階梯
            for(let i=0; i<4; i++) {
                platforms.push(new Platform(2700 + i*60, screenHeight - 100 - i*50, 60, 50 + i*50, 'brick'));
            }

            // 終點旗幟
            finishFlag = new Flag(3050, screenHeight - 350);
        }

        function updateUI() {
            document.getElementById('score-text').innerText = score;
            document.getElementById('chest-count').innerText = chestsOpened + "/5";
        }

        // --- 碰撞邏輯 ---
        function colCheck(shapeA, shapeB) {
            let vX = (shapeA.x + (shapeA.width / 2)) - (shapeB.x + (shapeB.width / 2));
            let vY = (shapeA.y + (shapeA.height / 2)) - (shapeB.y + (shapeB.height / 2));
            let hWidths = (shapeA.width / 2) + (shapeB.width / 2);
            let hHeights = (shapeA.height / 2) + (shapeB.height / 2);
            let colDir = null;

            if (Math.abs(vX) < hWidths && Math.abs(vY) < hHeights) {
                let oX = hWidths - Math.abs(vX);
                let oY = hHeights - Math.abs(vY);
                if (oX >= oY) {
                    if (vY > 0) {
                        colDir = "t"; 
                        shapeA.y += oY;
                    } else {
                        colDir = "b"; 
                        shapeA.y -= oY;
                    }
                } else {
                    if (vX > 0) {
                        colDir = "l";
                        shapeA.x += oX;
                    } else {
                        colDir = "r";
                        shapeA.x -= oX;
                    }
                }
            }
            return colDir;
        }

        function checkOverlay(rect1, rect2) {
             return (rect1.x < rect2.x + rect2.width &&
                     rect1.x + rect1.width > rect2.x &&
                     rect1.y < rect2.y + rect2.height &&
                     rect1.y + rect1.height > rect2.y);
        }

        // --- 控制 ---
        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');
        const jumpBtn = document.getElementById('jump-btn');
        let joystickCenter = { x: 0, y: 0 };
        let touchId = null;

        joystickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            const rect = joystickArea.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            updateJoystick(touch.clientX, touch.clientY);
        }, {passive: false});

        joystickArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === touchId) {
                    updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                }
            }
        }, {passive: false});

        joystickArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            resetJoystick();
        }, {passive: false});

        function updateJoystick(x, y) {
            const maxDist = 40;
            let dx = x - joystickCenter.x;
            let dy = y - joystickCenter.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxDist) {
                let ratio = maxDist / dist;
                dx *= ratio;
                dy *= ratio;
            }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            if(dx < -10) { input.left = true; input.right = false; } 
            else if (dx > 10) { input.left = false; input.right = true; } 
            else { input.left = false; input.right = false; }
        }

        function resetJoystick() {
            joystickKnob.style.transform = `translate(-50%, -50%)`;
            input.left = false; input.right = false; touchId = null;
        }

        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            input.jump = true;
        }, {passive: false});
        
        jumpBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            input.jump = false;
        }, {passive: false});

        window.addEventListener('keydown', (e) => {
            if(e.code === 'ArrowLeft') input.left = true;
            if(e.code === 'ArrowRight') input.right = true;
            if(e.code === 'Space' || e.code === 'ArrowUp') input.jump = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'ArrowLeft') input.left = false;
            if(e.code === 'ArrowRight') input.right = false;
            if(e.code === 'Space' || e.code === 'ArrowUp') input.jump = false;
        });

        // --- 答題 ---
        function triggerQuiz(chest) {
            if (gameQuestions.length === 0) return; 

            gameState = 'QUIZ';
            currentChest = chest;
            input.left = false; 
            input.right = false;
            
            const modal = document.getElementById('quiz-modal');
            const qText = document.getElementById('question-text');
            const optContainer = document.getElementById('options-container');
            const feedback = document.getElementById('feedback-msg');
            const continueBtn = document.getElementById('continue-btn'); // 確保獲取到按鈕
            
            const qData = gameQuestions.pop();
            
            qText.innerText = qData.q;
            feedback.innerText = "";
            optContainer.innerHTML = "";
            continueBtn.style.display = 'none'; // 重置按鈕狀態
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, qData.ans, qData.feedback, btn);
                optContainer.appendChild(btn);
            });
            
            modal.style.display = "flex";
        }
        
        function checkAnswer(selected, correct, feedbackText, btnElement) {
            const feedback = document.getElementById('feedback-msg');
            const allBtns = document.querySelectorAll('.option-btn');
            const continueBtn = document.getElementById('continue-btn'); // 獲取繼續按鈕

            allBtns.forEach(b => b.onclick = null);

            let isSuccess = false;

            if(selected === correct) {
                btnElement.classList.add('correct');
                feedback.innerText = "答對了！ " + feedbackText;
                feedback.style.color = "green";
                score += 100;
                updateUI();
                isSuccess = true;
            } else {
                btnElement.classList.add('wrong');
                feedback.innerText = "哎呀答錯了... 寶箱消失了！";
                feedback.style.color = "red";
                allBtns[correct].classList.add('correct');
                isSuccess = false;
            }

            // 顯示繼續按鈕並設定點擊事件
            continueBtn.style.display = 'inline-block';
            continueBtn.onclick = () => closeQuiz(isSuccess);
        }
        
        function closeQuiz(success) {
            document.getElementById('quiz-modal').style.display = "none";
            
            if(success) {
                currentChest.opened = true;
                chestsOpened++;
                updateUI();
            } else {
                currentChest.vanished = true;
            }
            
            gameState = 'PLAYING';
            input.jump = false; 
            if(!currentChest.vanished) player.x -= 50;
        }

        // --- 主迴圈 ---
        function update() {
            if (gameState !== 'PLAYING') return;

            player.update();
            camera.follow(player);
            
            // 金幣
            coins.forEach(c => {
                c.update();
                if(!c.collected && checkOverlay(player, c)) {
                    c.collected = true;
                    score += 10;
                    updateUI();
                }
            });

            // 寶箱
            chests.forEach(chest => {
                if(!chest.opened && !chest.vanished && checkOverlay(player, chest)) {
                    triggerQuiz(chest);
                }
            });

            // 終點檢查
            if (player.x >= finishFlag.x + 20) {
                gameWin();
            }
        }
        
        function gameWin() {
            if (gameState === 'END') return;
            gameState = 'END';
            
            document.getElementById('quiz-modal').style.display = "none";
            document.getElementById('end-title').innerText = "冒險完成！";
            document.getElementById('end-msg').innerText = "恭喜你到達終點！";
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-chests').innerText = chestsOpened;
            document.getElementById('end-screen').style.display = 'flex';
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#5c94fc";
            ctx.fillRect(0,0, canvas.width, canvas.height);
            
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            for(let i=0; i<15; i++) {
                let cloudX = (i * 400 - camera.x * 0.5) % (mapWidth + 800);
                if (cloudX < -200) cloudX += mapWidth + 800;
                ctx.beginPath();
                ctx.arc(cloudX, 100, 40, 0, Math.PI*2);
                ctx.arc(cloudX+50, 110, 50, 0, Math.PI*2);
                ctx.arc(cloudX+100, 100, 40, 0, Math.PI*2);
                ctx.fill();
            }

            platforms.forEach(p => p.draw(ctx, camera.x));
            if(finishFlag) finishFlag.draw(ctx, camera.x);
            chests.forEach(c => c.draw(ctx, camera.x));
            coins.forEach(c => c.draw(ctx, camera.x));
            player.draw(ctx, camera.x);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            score = 0;
            chestsOpened = 0;
            updateUI();
            
            gameQuestions = [...questionsSource];
            shuffleArray(gameQuestions);
            
            document.getElementById('start-screen').style.display = 'none';
            initLevel();
            gameState = 'PLAYING';
            loop();
        }
        
        window.addEventListener('resize', () => {
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            canvas.width = screenWidth;
            canvas.height = screenHeight;
            initLevel(); 
        });

    </script>
</body>
</html>
